<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1456" height="976" class="bnb-yard yp-svg" viewBox="0 0 182 122" role="img" aria-labelledby="yp-title yp-desc">
  <title id="yp-title">Schematic site plan of the BNBSBD shipyard at Fomar, Shiroda, Goa</title>
  <desc id="yp-desc">Plan view, river along the bottom, north to the left. On the waterfront quay the ship building area measures 67.5 m by 20 m (1,350 m²). A to-scale outline of Lourdes (52.68 m by 12.50 m) sits centred on it, with 7.41 m clear at each end and 3.75 m along each side. The main yard buildings stand behind the ship building area. Further north are a walled basin, a place for two containers (annotated 6×6) and the blasting shed (10 m by 12 m). Approximate scale; buildings simplified.</desc>
  <style>.bnb-yard{--yp-land:#dfe5e1;--yp-tree:#d2dad4;--yp-hard:#f6f4ef;--yp-hard-line:#c4cac6;--yp-track:#e9e1d3;--yp-water:#173047;--yp-water-2:#0d1f2e;--yp-flow:rgba(255,255,255,.07);--yp-quay:#3c4853;--yp-bank:#93a099;--yp-bldg:#aeb8c0;--yp-bldg-line:#56636e;--yp-shade:rgba(15,27,38,.13);--yp-acc:#ea5a16;--yp-acc-fill:rgba(234,90,22,.09);--yp-acc-hatch:rgba(234,90,22,.42);--yp-ship:#0f1b26;--yp-ship-fill:rgba(255,255,255,.74);--yp-ink:#0f1b26;--yp-ink-2:#46545f;--yp-halo:rgba(246,244,239,.9);--yp-on-water:#eef2f5;--yp-on-water-2:#a9b8c4;--yp-frame:rgba(15,27,38,.28);display:block;container-type:inline-size}.bnb-yard[data-tone=dark],.section--dark .bnb-yard:not([data-tone=light]){--yp-land:#122130;--yp-tree:#162839;--yp-hard:#20344a;--yp-hard-line:rgba(233,238,242,.16);--yp-track:#283c51;--yp-water:#0a1622;--yp-water-2:#050c14;--yp-flow:rgba(255,255,255,.06);--yp-quay:#9aa8b4;--yp-bank:#4c5f70;--yp-bldg:#4f5f6e;--yp-bldg-line:#93a2ae;--yp-shade:rgba(0,0,0,.28);--yp-acc-fill:rgba(234,90,22,.14);--yp-acc-hatch:rgba(234,90,22,.5);--yp-ship:#eef2f5;--yp-ship-fill:rgba(8,16,25,.62);--yp-ink:#e9eef2;--yp-ink-2:#aab7c2;--yp-halo:rgba(18,33,48,.85);--yp-on-water-2:#8d9cab;--yp-frame:rgba(233,238,242,.22)}.bnb-yard .yp-svg{display:block;width:100%;height:auto;overflow:hidden}.bnb-yard .yp-land{fill:var(--yp-land)}.bnb-yard .yp-tree-dot{fill:var(--yp-tree)}.bnb-yard .yp-hard{fill:var(--yp-hard);stroke:var(--yp-hard-line);stroke-width:.25;stroke-linejoin:round}.bnb-yard .yp-track{fill:none;stroke:var(--yp-track);stroke-linecap:round;stroke-linejoin:round}.bnb-yard .yp-s1{stop-color:var(--yp-water)}.bnb-yard .yp-s2{stop-color:var(--yp-water-2)}.bnb-yard .yp-flow{fill:none;stroke:var(--yp-flow);stroke-width:.28;stroke-linecap:round}.bnb-yard .yp-quay{fill:none;stroke:var(--yp-quay);stroke-width:.8;stroke-linejoin:round}.bnb-yard .yp-bank{fill:none;stroke:var(--yp-bank);stroke-width:.35;stroke-linejoin:round}.bnb-yard .yp-shade{fill:var(--yp-shade)}.bnb-yard .yp-bldg{fill:var